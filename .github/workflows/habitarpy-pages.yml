name: Habitarpy Pages

on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "sites/habitarpy/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/habitarpy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "habitarpy-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web app
        working-directory: apps/mobile
        run: >
          flutter build web --release --base-href /app/
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Copy Flutter web app into site
        shell: bash
        run: |
          rm -rf sites/habitarpy/app
          mkdir -p sites/habitarpy/app
          cp -R apps/mobile/build/web/. sites/habitarpy/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/habitarpy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
