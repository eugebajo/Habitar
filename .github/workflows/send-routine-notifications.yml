name: Enviar notificaciones de rutinas completadas

# Etapa 3 (notificaciones push), Parte 2 - dispara la Edge Function
# send-routine-notification cada 5 minutos. El disparo vive acá y no en un
# trigger de la base a propósito: ver el comentario al principio de
# supabase/functions/send-routine-notification/index.ts y el header de
# supabase/migrations/0015_device_tokens.sql para la decisión completa.
#
# Este workflow NO necesita la service_role key ni la clave de Firebase -
# esas viven solo del lado de Supabase (secreto de la Edge Function, ver el
# README de la función). Acá alcanza con la anon key del proyecto, que es
# la misma que ya viaja embebida en la app Flutter - su rol es únicamente
# pasar la verificación de JWT que exige la función (paso 2 del README:
# se despliega SIN --no-verify-jwt).

on:
  schedule:
    # Cada 5 minutos. GitHub no garantiza el minuto exacto bajo carga del
    # runner compartido - un par de minutos de atraso ocasional es
    # aceptable para este caso de uso (ver la justificación de latencia
    # en la migración 0015).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
    # Permite disparar la corrida a mano desde la pestaña Actions - usado
    # en el paso 6 del README de la función para probar sin esperar.

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a send-routine-notification
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Falta el secreto SUPABASE_ANON_KEY en este repositorio (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi

          http_status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            'https://frmgwpbstezqjwbcshbw.supabase.co/functions/v1/send-routine-notification' \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Respuesta de la función (status $http_status):"
          cat response.json
          echo

          if [ "$http_status" -ge 300 ]; then
            echo "La función devolvió un error - ver el cuerpo de arriba y los logs en el dashboard de Supabase." >&2
            exit 1
          fi
